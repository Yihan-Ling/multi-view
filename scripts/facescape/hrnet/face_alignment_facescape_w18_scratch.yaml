# HRNetV2-W18 on FaceScape synthetic -- FROM SCRATCH + on-the-fly photometric aug.
# Differs from face_alignment_facescape_w18.yaml in two ways:
#   1. MODEL.PRETRAINED = ''  -> backbone trained from random init (no ImageNet).
#   2. run via run_train.py, which swaps the loader to FaceScapeAug (live aug).
# Distinct cfg filename => distinct output dir (output/.../face_alignment_facescape_w18_scratch),
# so this never overwrites the forte/sharp runs.
# Run from the MAIN repo root (DATASET/OUTPUT paths are relative to it).
GPUS: (0,)
WORKERS: 8
PRINT_FREQ: 50
OUTPUT_DIR: 'output'
LOG_DIR: 'log'

DATASET:
  DATASET: 300W
  ROOT: './data/facescape/HRNet_train/images'
  TRAINSET: './data/facescape/HRNet_train/train.csv'
  TESTSET: './data/facescape/HRNet_train/val.csv'
  FLIP: true
  SCALE_FACTOR: 0.25
  ROT_FACTOR: 30
MODEL:
  NAME: 'hrnet'
  NUM_JOINTS: 68
  INIT_WEIGHTS: true
  PRETRAINED: ''          # <-- FROM SCRATCH (no ImageNet warm start)
  SIGMA: 1.0
  IMAGE_SIZE:
    - 256
    - 256
  HEATMAP_SIZE:
    - 64
    - 64
  EXTRA:
    FINAL_CONV_KERNEL: 1
    STAGE2:
      NUM_MODULES: 1
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
      FUSE_METHOD: SUM
    STAGE3:
      NUM_MODULES: 4
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
        - 72
      FUSE_METHOD: SUM
    STAGE4:
      NUM_MODULES: 3
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
        - 72
        - 144
      FUSE_METHOD: SUM
TRAIN:
  # Proven forte recipe (from-scratch, BS64): forte converged to synth-val NME
  # ~0.039 by epoch ~42 and was flat after, so 60 epochs is enough. BS64 fits the
  # spgpu A40 (48 GB). On an 8 GB laptop, drop BATCH_SIZE_PER_GPU to 16.
  BATCH_SIZE_PER_GPU: 64
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 60
  RESUME: false
  OPTIMIZER: 'adam'
  LR: 0.0001
  WD: 0.0
  LR_STEP: [30, 50]
  MOMENTUM: 0.0
  NESTEROV: false
TEST:
  BATCH_SIZE_PER_GPU: 256
