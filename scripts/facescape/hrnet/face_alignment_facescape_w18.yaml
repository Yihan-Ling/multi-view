# HRNetV2-W18 face-landmark training on the FaceScape synthetic set.
# Reuses the Face300W loader (DATASET: 300W) because build_hrnet_landmark_dataset.py
# emits the exact 300W CSV format. Paths are relative to the MAIN repo root --
# run train.py from there (see scripts/facescape/hrnet/README.md).
GPUS: (0,)
WORKERS: 4
PRINT_FREQ: 50
OUTPUT_DIR: 'output'
LOG_DIR: 'log'

DATASET:
  DATASET: 300W
  ROOT: './data/facescape/HRNet_train/images'
  TRAINSET: './data/facescape/HRNet_train/train.csv'
  TESTSET: './data/facescape/HRNet_train/val.csv'
  FLIP: true
  SCALE_FACTOR: 0.25
  ROT_FACTOR: 30
MODEL:
  NAME: 'hrnet'
  NUM_JOINTS: 68
  INIT_WEIGHTS: true
  # ImageNet-pretrained W18 backbone (optional but recommended; see README).
  # Set to '' to train the backbone from scratch.
  PRETRAINED: 'hrnetv2_pretrained/hrnetv2_w18_imagenet_pretrained.pth'
  SIGMA: 1.0
  IMAGE_SIZE:
    - 256
    - 256
  HEATMAP_SIZE:
    - 64
    - 64
  EXTRA:
    FINAL_CONV_KERNEL: 1
    STAGE2:
      NUM_MODULES: 1
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
      FUSE_METHOD: SUM
    STAGE3:
      NUM_MODULES: 4
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
        - 72
      FUSE_METHOD: SUM
    STAGE4:
      NUM_MODULES: 3
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS:
        - 4
        - 4
        - 4
        - 4
      NUM_CHANNELS:
        - 18
        - 36
        - 72
        - 144
      FUSE_METHOD: SUM
TRAIN:
  BATCH_SIZE_PER_GPU: 16
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 60
  RESUME: false
  OPTIMIZER: 'adam'
  LR: 0.0001
  WD: 0.0
  LR_STEP: [30, 50]
  MOMENTUM: 0.0
  NESTEROV: false
TEST:
  BATCH_SIZE_PER_GPU: 16
